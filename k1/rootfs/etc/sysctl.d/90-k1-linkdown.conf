# KICKPI K1A: eth0 and wlan0 sit in the same subnet. When the Ethernet cable is unplugged, ifupdown
# keeps the eth0 routes, so replies to packets that came in over Wi-Fi went out the dead eth0
# and SSH over Wi-Fi timed out. Ignore routes of interfaces without carrier.
net.ipv4.conf.all.ignore_routes_with_linkdown = 1
net.ipv4.conf.default.ignore_routes_with_linkdown = 1
